name: HAT factorial specificity 3B

on:
  push:
    branches:
      - hat-factorial-3b
  workflow_dispatch:

jobs:
  specificity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate pandas numpy matplotlib sentencepiece
      - name: Run frozen factorial specificity test on 3B
        env:
          HF_HOME: ${{ runner.temp }}/hf
        run: |
          python hat_open_model_pilot/run_factorial_specificity.py --model Qwen/Qwen2.5-3B-Instruct --outdir hat_factorial_3b_results
      - name: Upload factorial results
        uses: actions/upload-artifact@v4
        with:
          name: hat-factorial-specificity-3b-results
          path: hat_factorial_3b_results
