name: HAT factorial specificity

on:
  push:
    branches:
      - hat-factorial-specificity
  workflow_dispatch:

jobs:
  specificity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate pandas numpy matplotlib sentencepiece
      - name: Run factorial specificity test
        env:
          HF_HOME: ${{ runner.temp }}/hf
        run: |
          python hat_open_model_pilot/run_factorial_specificity.py --model Qwen/Qwen2.5-1.5B-Instruct --outdir hat_factorial_specificity_results
      - name: Upload factorial results
        uses: actions/upload-artifact@v4
        with:
          name: hat-factorial-specificity-results
          path: hat_factorial_specificity_results
