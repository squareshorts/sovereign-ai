name: HAT open-model pilot

on:
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hat-open-model-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate pandas numpy matplotlib sentencepiece
      - name: Run mechanistic self-report pilot
        env:
          HF_HOME: ${{ runner.temp }}/hf
        run: |
          python hat_open_model_pilot/run_open_model_pilot.py --model Qwen/Qwen2.5-0.5B-Instruct --trials 4 --outdir hat_open_model_results
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: hat-open-model-results
          path: hat_open_model_results
